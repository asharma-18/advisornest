{% extends "base.html" %}

{% block title %}Reset Password — AdvisorNest{% endblock %}

{% block extra_css %}
<style>
    .navbar { display: none; }
    .footer { display: none; }
    .main-content { padding: 0; max-width: 100%; }
    * { box-sizing: border-box; }

    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f7f3eb;
    }

    .auth-nav {
        background: var(--navy);
        padding: 0 52px;
        display: flex;
        align-items: center;
        height: 56px;
        flex-shrink: 0;
    }

    .auth-nav-logo {
        font-family: var(--font-heading);
        font-size: 1.3rem;
        font-weight: 700;
        color: white;
    }

    .auth-nav-logo span {
        color: var(--accent);
        font-style: italic;
    }

    .auth-gold-rule {
        height: 2px;
        background: linear-gradient(90deg, var(--accent), #b8872e, var(--accent));
        flex-shrink: 0;
    }

    .auth-body {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 460px;
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 48px rgba(26,26,46,0.1);
    }

    .auth-card-top {
        background: var(--navy);
        padding: 28px 40px;
    }

    .auth-card-icon {
        font-size: 2rem;
        margin-bottom: 8px;
        display: block;
    }

    .auth-card-title {
        font-family: var(--font-heading);
        font-size: 1.3rem;
        color: white;
        margin-bottom: 4px;
    }

    .auth-card-sub {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.45);
    }

    .auth-card-body { padding: 36px 40px; }

    .auth-field {
        margin-bottom: 20px;
    }

    .auth-field-label {
        display: block;
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .auth-field-input {
        width: 100%;
        height: 44px;
        background: #f7f3eb;
        border: 1.5px solid #e0d8cc;
        border-radius: 8px;
        padding: 0 14px;
        font-size: 0.9rem;
        color: var(--text-primary);
        font-family: var(--font-body);
        outline: none;
        transition: all 0.2s;
    }

    .auth-field-input:focus {
        border-color: var(--navy);
        background: white;
        box-shadow: 0 0 0 3px rgba(44,74,110,0.07);
    }

    .auth-field-input::placeholder { color: #c4b89e; }

    .auth-field-hint {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 5px;
    }

    .auth-btn {
        width: 100%;
        height: 46px;
        background: var(--navy);
        color: white;
        border: none;
        border-radius: 8px;
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
    }

    .auth-btn:hover {
        background: var(--navy-light);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(44,74,110,0.25);
    }

    .auth-back {
        text-align: center;
        margin-top: 16px;
        font-size: 0.825rem;
        color: var(--text-muted);
    }

    .auth-back a {
        color: var(--navy);
        font-weight: 600;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">

    <div class="auth-nav">
        <div class="auth-nav-logo">
            Advisor<span>Nest</span>
        </div>
    </div>

    <div class="auth-gold-rule"></div>

    <div class="auth-body">
        <div class="auth-card">

            <div class="auth-card-top">
                <span class="auth-card-icon">🔐</span>
                <div class="auth-card-title">Create new password</div>
                <div class="auth-card-sub">
                    Choose a strong password for your account
                </div>
            </div>

            <div class="auth-card-body">

                <form method="POST"
                      action="{{ url_for('main.reset_password') }}">
                    <input type="hidden" name="token" value="{{ token or '' }}">
                    <input type="hidden" name="refresh_token" value="{{ refresh or '' }}">

                    <div class="auth-field">
                        <label class="auth-field-label" for="password">
                            New Password
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="auth-field-input"
                            placeholder="Minimum 8 characters"
                            required
                            minlength="8"
                        >
                        <div class="auth-field-hint">
                            Must be at least 8 characters
                        </div>
                    </div>

                    <div class="auth-field">
                        <label class="auth-field-label"
                               for="confirm_password">
                            Confirm New Password
                        </label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="auth-field-input"
                            placeholder="Repeat your password"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-btn">
                        Update Password
                    </button>
                    <script>
                    // Capture token from URL hash fragment
                    window.addEventListener('load', function() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token') || 
                        new URLSearchParams(window.location.search).get('token') ||
                        new URLSearchParams(window.location.search).get('access_token');
    const refreshToken = params.get('refresh_token') ||
                         new URLSearchParams(window.location.search).get('refresh_token');
    if (accessToken) {
        document.querySelector('input[name="token"]').value = accessToken;
    }
    if (refreshToken) {
        document.querySelector('input[name="refresh_token"]').value = refreshToken;
    }
});
                </script>

                </form>

                <div class="auth-back">
                    <a href="{{ url_for('main.login') }}">
                        ← Back to Log In
                    </a>
                </div>

            </div>
        </div>
    </div>

</div>
{% endblock %}
